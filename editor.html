<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Magnético N1</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#141517;color:#f5f5f5;margin:0}.wrap{max-width:760px;margin:40px auto;padding:24px}h1{font-size:30px}p{color:#bbb}.panel{background:#222428;border:1px solid #3b3c40;border-radius:18px;padding:24px}input{display:block;margin:16px 0;width:100%}button,.download{display:inline-block;background:#b7efb0;color:#151515;border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}video{max-width:100%;max-height:450px;display:block;margin:20px auto}label{display:flex;align-items:center;gap:8px}label input{width:auto;margin:0}#status{white-space:pre-wrap}textarea{width:100%;min-height:110px;background:#111;color:#eee;border:1px solid #555;padding:10px;border-radius:8px}</style></head><body><main class="wrap"><h1>🎬 Editor Magnético N1</h1><p>Estilo referência · intensidade equilibrada · primeira versão</p><section class="panel"><form id="form"><strong>1. Envie seu vídeo</strong><input name="file" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska" required><label><input name="remove_silence" type="checkbox" checked> Remover pausas longas automaticamente</label><p>Até 200 MB e 3 minutos. O vídeo é enviado ao servidor que você configurar.</p><button id="send">Editar vídeo</button></form><p id="status" role="status"></p><div id="result" hidden><h2>Seu vídeo editado</h2><video id="preview" controls playsinline></video><p><a class="download" id="download">Baixar MP4</a></p><h3>Transcrição</h3><textarea id="transcript" readonly></textarea></div></section></main><script>const form=document.getElementById("form"),status=document.getElementById("status"),send=document.getElementById("send"),result=document.getElementById("result");form.onsubmit=async e=>{e.preventDefault();send.disabled=true;result.hidden=true;status.textContent="Processando. A primeira execução pode demorar para baixar o modelo de transcrição.";try{const data=new FormData(form);data.set("remove_silence",String(form.remove_silence.checked));const r=await fetch("/api/edit",{method:"POST",body:data});const j=await r.json();if(!r.ok)throw Error(j.detail||"Falha ao editar");document.getElementById("preview").src=j.download;document.getElementById("download").href=j.download;document.getElementById("transcript").value=j.transcript;result.hidden=false;status.textContent="Edição concluída."}catch(err){status.textContent="Erro: "+err.message}finally{send.disabled=false}};</script></body></html>

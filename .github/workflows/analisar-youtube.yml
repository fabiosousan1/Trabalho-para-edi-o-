name: Analisar YouTube Shorts
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Link do YouTube Shorts"
        required: true
        default: "https://www.youtube.com/shorts/kveX-g95sgg"
jobs:
  analisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar informações públicas do vídeo
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: python youtube_analyzer.py "$VIDEO_URL" | tee resultado.txt
      - name: Salvar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-youtube
          path: resultado.txt
          if-no-files-found: ignore
